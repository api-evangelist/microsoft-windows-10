provider: Microsoft Windows 10
providerId: microsoft-windows-10
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Operating System
  - Microsoft
description: Windows 10 platform APIs (Win32, UWP, WinRT) execute in-process on the local device and
  are not exposed as a hosted, metered HTTP API; there are no per-second / per-minute network rate
  limits to publish. Network-facing services that ride on Windows 10 (Microsoft Store, Windows Update,
  Microsoft Graph) are governed by their own throttling models.
sources:
  - https://learn.microsoft.com/en-us/windows/win32/api/
  - https://learn.microsoft.com/en-us/windows/whats-new/extended-security-updates
notes: Windows 10 itself is a device OS. Per-API rate limits do not apply to local Win32/UWP/WinRT
  surface area; ride-along network services document throttling separately.
responseCodes: {}
limits:
  - name: Local platform APIs (Win32 / UWP / WinRT)
    scope: device
    metric: varies
    limit: 'Local in-process calls; no per-second network rate limit'
    notes: Subject only to OS / handle / quota constraints on the local device.
  - name: Microsoft Store for Business / Consumer
    scope: account
    metric: varies
    limit: 'Governed by Microsoft Graph throttling; see Graph throttling guidance'
  - name: Windows Update for Business / WSUS
    scope: account
    metric: varies
    limit: 'Per-tenant; published by Microsoft endpoint manager / Intune docs'
policies:
  - name: Honor Retry-After
    description: For network-facing services consumed from Windows 10 (Microsoft Graph, Store, Update),
      honor the Retry-After header on 429 responses.
  - name: Local resource governance
    description: Win32 / WinRT APIs may return ERROR_TOO_MANY_OPEN_FILES / RPC_S_OUT_OF_RESOURCES /
      similar local resource errors; design for graceful retry.
