principles:
  - name: Visibility
    description: Pull ESU enrollment counts from Microsoft 365 admin center Volume Licensing Product
      Details; cross-reference with Intune device inventory to identify devices still on Windows 10
      22H2.
  - name: Allocation
    description: Tag ESU charges by business unit / OU; allocate cloud-entitled (no-cost) ESU separately
      from Volume Licensing ESU so the migration value is visible.
  - name: Optimization
    description: Migrate eligible devices to Windows 11 to avoid the year-2 ($122) and year-3 ($244)
      ESU price escalations; move stragglers to Windows 365 / Azure Virtual Desktop where ESU is free;
      decommission Windows 10 devices on hardware ineligible for Windows 11.
  - name: Accountability
    description: Assign an ESU budget owner per business unit; review remaining Windows 10 inventory
      monthly; require approval for new ESU year purchases.
