description: 'FOCUS-aligned FinOps for Windows 10: post-EOS the primary spend lever is per-device,
  per-year Extended Security Updates (ESU) under Volume Licensing, with cumulative pricing that doubles
  each year (Year 1 $61, Year 2 $122, Year 3 $244). Windows 10 VMs running on Microsoft cloud services
  receive ESU at no additional charge.'
