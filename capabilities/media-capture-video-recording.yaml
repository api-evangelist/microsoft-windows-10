naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Media Capture API — Video Recording
  description: 'Microsoft Windows 10 Windows Media Capture API — Video Recording. 2 operations. Lead operation: Microsoft
    Windows 10 Start video recording. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Video Recording
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: media-capture-video-recording
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Media Capture API — Video Recording business capability. Self-contained, no
      shared references.
    resources:
    - name: media-capture-sessions-sessionId-video-start
      path: /media/capture/sessions/{sessionId}/video/start
      operations:
      - name: startvideorecording
        method: POST
        description: Microsoft Windows 10 Start video recording
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Capture session identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: media-capture-sessions-sessionId-video-stop
      path: /media/capture/sessions/{sessionId}/video/stop
      operations:
      - name: stopvideorecording
        method: POST
        description: Microsoft Windows 10 Stop video recording
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Capture session identifier
          required: true
  exposes:
  - type: rest
    namespace: media-capture-video-recording-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Media Capture API — Video Recording. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/media/capture/sessions/{sessionid}/video/start
      name: media-capture-sessions-sessionid-video-start
      description: REST surface for media-capture-sessions-sessionId-video-start.
      operations:
      - method: POST
        name: startvideorecording
        description: Microsoft Windows 10 Start video recording
        call: media-capture-video-recording.startvideorecording
        with:
          sessionId: rest.sessionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/media/capture/sessions/{sessionid}/video/stop
      name: media-capture-sessions-sessionid-video-stop
      description: REST surface for media-capture-sessions-sessionId-video-stop.
      operations:
      - method: POST
        name: stopvideorecording
        description: Microsoft Windows 10 Stop video recording
        call: media-capture-video-recording.stopvideorecording
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: media-capture-video-recording-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Media Capture API — Video Recording. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-start-video
      description: Microsoft Windows 10 Start video recording
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: media-capture-video-recording.startvideorecording
      with:
        sessionId: tools.sessionId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-stop-video
      description: Microsoft Windows 10 Stop video recording
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: media-capture-video-recording.stopvideorecording
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
