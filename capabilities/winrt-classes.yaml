naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Runtime (WinRT) API — Classes
  description: 'Microsoft Windows 10 Windows Runtime (WinRT) API — Classes. 2 operations. Lead operation: Microsoft Windows
    10 List classes in a namespace. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Classes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winrt-classes
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Runtime (WinRT) API — Classes business capability. Self-contained, no shared
      references.
    resources:
    - name: winrt-namespaces-namespaceName-classes
      path: /winrt/namespaces/{namespaceName}/classes
      operations:
      - name: listnamespaceclasses
        method: GET
        description: Microsoft Windows 10 List classes in a namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: namespaceName
          in: path
          type: string
          description: The fully qualified WinRT namespace name (e.g., Windows.UI.Notifications)
          required: true
    - name: winrt-namespaces-namespaceName-classes-className
      path: /winrt/namespaces/{namespaceName}/classes/{className}
      operations:
      - name: getclassdetails
        method: GET
        description: Microsoft Windows 10 Get class details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: namespaceName
          in: path
          type: string
          description: The fully qualified WinRT namespace name
          required: true
        - name: className
          in: path
          type: string
          description: The class name
          required: true
  exposes:
  - type: rest
    namespace: winrt-classes-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Classes. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/winrt/namespaces/{namespacename}/classes
      name: winrt-namespaces-namespacename-classes
      description: REST surface for winrt-namespaces-namespaceName-classes.
      operations:
      - method: GET
        name: listnamespaceclasses
        description: Microsoft Windows 10 List classes in a namespace
        call: winrt-classes.listnamespaceclasses
        with:
          namespaceName: rest.namespaceName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/winrt/namespaces/{namespacename}/classes/{classname}
      name: winrt-namespaces-namespacename-classes-classname
      description: REST surface for winrt-namespaces-namespaceName-classes-className.
      operations:
      - method: GET
        name: getclassdetails
        description: Microsoft Windows 10 Get class details
        call: winrt-classes.getclassdetails
        with:
          namespaceName: rest.namespaceName
          className: rest.className
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winrt-classes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Classes. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-classes
      description: Microsoft Windows 10 List classes in a namespace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winrt-classes.listnamespaceclasses
      with:
        namespaceName: tools.namespaceName
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-get-class
      description: Microsoft Windows 10 Get class details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winrt-classes.getclassdetails
      with:
        namespaceName: tools.namespaceName
        className: tools.className
      outputParameters:
      - type: object
        mapping: $.
