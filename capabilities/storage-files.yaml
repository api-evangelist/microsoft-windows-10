naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Storage API — Files
  description: 'Microsoft Windows 10 Windows Storage API — Files. 3 operations. Lead operation: Microsoft Windows 10 List
    storage files. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: storage-files
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Storage API — Files business capability. Self-contained, no shared references.
    resources:
    - name: storage-files
      path: /storage/files
      operations:
      - name: liststoragefiles
        method: GET
        description: Microsoft Windows 10 List storage files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: folderId
          in: query
          type: string
          description: Known folder identifier (Documents, Pictures, Music, Videos)
        - name: fileType
          in: query
          type: string
          description: Filter by file extension (e.g., .jpg, .mp3)
    - name: storage-files-fileId
      path: /storage/files/{fileId}
      operations:
      - name: getstoragefile
        method: GET
        description: Microsoft Windows 10 Get file details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique file identifier or path
          required: true
      - name: deletestoragefile
        method: DELETE
        description: Microsoft Windows 10 Delete a file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fileId
          in: path
          type: string
          description: Unique file identifier
          required: true
        - name: option
          in: query
          type: string
          description: Delete option
  exposes:
  - type: rest
    namespace: storage-files-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Storage API — Files. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/storage/files
      name: storage-files
      description: REST surface for storage-files.
      operations:
      - method: GET
        name: liststoragefiles
        description: Microsoft Windows 10 List storage files
        call: storage-files.liststoragefiles
        with:
          folderId: rest.folderId
          fileType: rest.fileType
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/storage/files/{fileid}
      name: storage-files-fileid
      description: REST surface for storage-files-fileId.
      operations:
      - method: GET
        name: getstoragefile
        description: Microsoft Windows 10 Get file details
        call: storage-files.getstoragefile
        with:
          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletestoragefile
        description: Microsoft Windows 10 Delete a file
        call: storage-files.deletestoragefile
        with:
          fileId: rest.fileId
          option: rest.option
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: storage-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Storage API — Files. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-storage
      description: Microsoft Windows 10 List storage files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: storage-files.liststoragefiles
      with:
        folderId: tools.folderId
        fileType: tools.fileType
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-get-file
      description: Microsoft Windows 10 Get file details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: storage-files.getstoragefile
      with:
        fileId: tools.fileId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-delete-file
      description: Microsoft Windows 10 Delete a file
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: storage-files.deletestoragefile
      with:
        fileId: tools.fileId
        option: tools.option
      outputParameters:
      - type: object
        mapping: $.
