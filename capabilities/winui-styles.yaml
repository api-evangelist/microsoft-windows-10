naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 WinUI API — Styles
  description: 'Microsoft Windows 10 WinUI API — Styles. 1 operations. Lead operation: Microsoft Windows 10 List built-in
    styles. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Styles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winui-styles
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 WinUI API — Styles business capability. Self-contained, no shared references.
    resources:
    - name: winui-styles
      path: /winui/styles
      operations:
      - name: liststyles
        method: GET
        description: Microsoft Windows 10 List built-in styles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceType
          in: query
          type: string
          description: Filter by resource type
  exposes:
  - type: rest
    namespace: winui-styles-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 WinUI API — Styles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/winui/styles
      name: winui-styles
      description: REST surface for winui-styles.
      operations:
      - method: GET
        name: liststyles
        description: Microsoft Windows 10 List built-in styles
        call: winui-styles.liststyles
        with:
          resourceType: rest.resourceType
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winui-styles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 WinUI API — Styles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-built
      description: Microsoft Windows 10 List built-in styles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winui-styles.liststyles
      with:
        resourceType: tools.resourceType
      outputParameters:
      - type: object
        mapping: $.
