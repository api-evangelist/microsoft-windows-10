naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Media Capture API — Sessions
  description: 'Microsoft Windows 10 Windows Media Capture API — Sessions. 1 operations. Lead operation: Microsoft Windows
    10 Initialize a media capture session. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: media-capture-sessions
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Media Capture API — Sessions business capability. Self-contained, no shared
      references.
    resources:
    - name: media-capture-sessions
      path: /media/capture/sessions
      operations:
      - name: initializemediacapture
        method: POST
        description: Microsoft Windows 10 Initialize a media capture session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: media-capture-sessions-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Media Capture API — Sessions. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/media/capture/sessions
      name: media-capture-sessions
      description: REST surface for media-capture-sessions.
      operations:
      - method: POST
        name: initializemediacapture
        description: Microsoft Windows 10 Initialize a media capture session
        call: media-capture-sessions.initializemediacapture
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: media-capture-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Media Capture API — Sessions. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-initialize-media
      description: Microsoft Windows 10 Initialize a media capture session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: media-capture-sessions.initializemediacapture
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
