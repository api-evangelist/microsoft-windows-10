naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Cortana API — Responses
  description: 'Microsoft Windows 10 Windows Cortana API — Responses. 1 operations. Lead operation: Microsoft Windows 10 Send
    a response to Cortana. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Responses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: cortana-responses
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Cortana API — Responses business capability. Self-contained, no shared references.
    resources:
    - name: cortana-responses
      path: /cortana/responses
      operations:
      - name: sendcortanaresponse
        method: POST
        description: Microsoft Windows 10 Send a response to Cortana
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: cortana-responses-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Cortana API — Responses. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/cortana/responses
      name: cortana-responses
      description: REST surface for cortana-responses.
      operations:
      - method: POST
        name: sendcortanaresponse
        description: Microsoft Windows 10 Send a response to Cortana
        call: cortana-responses.sendcortanaresponse
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cortana-responses-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Cortana API — Responses. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-send-response
      description: Microsoft Windows 10 Send a response to Cortana
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cortana-responses.sendcortanaresponse
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
