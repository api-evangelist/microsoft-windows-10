naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 DirectX Graphics API — Devices
  description: 'Microsoft Windows 10 DirectX Graphics API — Devices. 2 operations. Lead operation: Microsoft Windows 10 List
    DirectX graphics devices. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: directx-devices
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 DirectX Graphics API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: directx-devices
      path: /directx/devices
      operations:
      - name: listdirectxdevices
        method: GET
        description: Microsoft Windows 10 List DirectX graphics devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: directx-devices-adapterId
      path: /directx/devices/{adapterId}
      operations:
      - name: getdirectxdevice
        method: GET
        description: Microsoft Windows 10 Get graphics device details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: adapterId
          in: path
          type: string
          description: DXGI adapter identifier
          required: true
  exposes:
  - type: rest
    namespace: directx-devices-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 DirectX Graphics API — Devices. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/directx/devices
      name: directx-devices
      description: REST surface for directx-devices.
      operations:
      - method: GET
        name: listdirectxdevices
        description: Microsoft Windows 10 List DirectX graphics devices
        call: directx-devices.listdirectxdevices
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/directx/devices/{adapterid}
      name: directx-devices-adapterid
      description: REST surface for directx-devices-adapterId.
      operations:
      - method: GET
        name: getdirectxdevice
        description: Microsoft Windows 10 Get graphics device details
        call: directx-devices.getdirectxdevice
        with:
          adapterId: rest.adapterId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: directx-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 DirectX Graphics API — Devices. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-directx
      description: Microsoft Windows 10 List DirectX graphics devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: directx-devices.listdirectxdevices
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-get-graphics
      description: Microsoft Windows 10 Get graphics device details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: directx-devices.getdirectxdevice
      with:
        adapterId: tools.adapterId
      outputParameters:
      - type: object
        mapping: $.
