naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 WinUI API — Icons
  description: 'Microsoft Windows 10 WinUI API — Icons. 1 operations. Lead operation: Microsoft Windows 10 List Fluent Design
    icons. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Icons
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winui-icons
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 WinUI API — Icons business capability. Self-contained, no shared references.
    resources:
    - name: winui-icons
      path: /winui/icons
      operations:
      - name: listicons
        method: GET
        description: Microsoft Windows 10 List Fluent Design icons
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search
          in: query
          type: string
          description: Search icons by name
  exposes:
  - type: rest
    namespace: winui-icons-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 WinUI API — Icons. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/winui/icons
      name: winui-icons
      description: REST surface for winui-icons.
      operations:
      - method: GET
        name: listicons
        description: Microsoft Windows 10 List Fluent Design icons
        call: winui-icons.listicons
        with:
          search: rest.search
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winui-icons-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 WinUI API — Icons. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-fluent
      description: Microsoft Windows 10 List Fluent Design icons
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winui-icons.listicons
      with:
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
