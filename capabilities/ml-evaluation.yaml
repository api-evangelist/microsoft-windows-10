naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows ML API — Evaluation
  description: 'Microsoft Windows 10 Windows ML API — Evaluation. 1 operations. Lead operation: Microsoft Windows 10 Evaluate
    model with input data. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Evaluation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: ml-evaluation
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows ML API — Evaluation business capability. Self-contained, no shared references.
    resources:
    - name: ml-sessions-sessionId-evaluate
      path: /ml/sessions/{sessionId}/evaluate
      operations:
      - name: evaluatemlmodel
        method: POST
        description: Microsoft Windows 10 Evaluate model with input data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Unique identifier for the evaluation session
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: ml-evaluation-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows ML API — Evaluation. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/ml/sessions/{sessionid}/evaluate
      name: ml-sessions-sessionid-evaluate
      description: REST surface for ml-sessions-sessionId-evaluate.
      operations:
      - method: POST
        name: evaluatemlmodel
        description: Microsoft Windows 10 Evaluate model with input data
        call: ml-evaluation.evaluatemlmodel
        with:
          sessionId: rest.sessionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ml-evaluation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows ML API — Evaluation. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-evaluate-model
      description: Microsoft Windows 10 Evaluate model with input data
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ml-evaluation.evaluatemlmodel
      with:
        sessionId: tools.sessionId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
