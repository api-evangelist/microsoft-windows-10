naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Compass
  description: 'Microsoft Windows 10 Windows Sensors API — Compass. 1 operations. Lead operation: Microsoft Windows 10 Get
    compass reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Compass
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-compass
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Compass business capability. Self-contained, no shared references.
    resources:
    - name: sensors-compass-reading
      path: /sensors/compass/reading
      operations:
      - name: getcompassreading
        method: GET
        description: Microsoft Windows 10 Get compass reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-compass-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Compass. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/compass/reading
      name: sensors-compass-reading
      description: REST surface for sensors-compass-reading.
      operations:
      - method: GET
        name: getcompassreading
        description: Microsoft Windows 10 Get compass reading
        call: sensors-compass.getcompassreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-compass-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Compass. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-compass
      description: Microsoft Windows 10 Get compass reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-compass.getcompassreading
      outputParameters:
      - type: object
        mapping: $.
