naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Pedometer
  description: 'Microsoft Windows 10 Windows Sensors API — Pedometer. 1 operations. Lead operation: Microsoft Windows 10 Get
    pedometer reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Pedometer
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-pedometer
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Pedometer business capability. Self-contained, no shared references.
    resources:
    - name: sensors-pedometer-reading
      path: /sensors/pedometer/reading
      operations:
      - name: getpedometerreading
        method: GET
        description: Microsoft Windows 10 Get pedometer reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-pedometer-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Pedometer. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/pedometer/reading
      name: sensors-pedometer-reading
      description: REST surface for sensors-pedometer-reading.
      operations:
      - method: GET
        name: getpedometerreading
        description: Microsoft Windows 10 Get pedometer reading
        call: sensors-pedometer.getpedometerreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-pedometer-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Pedometer. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-pedometer
      description: Microsoft Windows 10 Get pedometer reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-pedometer.getpedometerreading
      outputParameters:
      - type: object
        mapping: $.
