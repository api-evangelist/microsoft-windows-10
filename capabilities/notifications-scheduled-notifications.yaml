naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Notifications API — Scheduled Notifications
  description: 'Microsoft Windows 10 Windows Notifications API — Scheduled Notifications. 2 operations. Lead operation: Microsoft
    Windows 10 Schedule a toast notification. Self-contained Naftiko capability covering one Microsoft Windows 10 business
    surface.'
  tags:
  - Microsoft Windows 10
  - Scheduled Notifications
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: notifications-scheduled-notifications
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Notifications API — Scheduled Notifications business capability. Self-contained,
      no shared references.
    resources:
    - name: notifications-toast-scheduled
      path: /notifications/toast/scheduled
      operations:
      - name: scheduletoastnotification
        method: POST
        description: Microsoft Windows 10 Schedule a toast notification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listscheduledtoastnotifications
        method: GET
        description: Microsoft Windows 10 List scheduled toast notifications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: notifications-scheduled-notifications-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Notifications API — Scheduled Notifications. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/notifications/toast/scheduled
      name: notifications-toast-scheduled
      description: REST surface for notifications-toast-scheduled.
      operations:
      - method: POST
        name: scheduletoastnotification
        description: Microsoft Windows 10 Schedule a toast notification
        call: notifications-scheduled-notifications.scheduletoastnotification
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listscheduledtoastnotifications
        description: Microsoft Windows 10 List scheduled toast notifications
        call: notifications-scheduled-notifications.listscheduledtoastnotifications
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: notifications-scheduled-notifications-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Notifications API — Scheduled Notifications. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-schedule-toast
      description: Microsoft Windows 10 Schedule a toast notification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: notifications-scheduled-notifications.scheduletoastnotification
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-list-scheduled
      description: Microsoft Windows 10 List scheduled toast notifications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: notifications-scheduled-notifications.listscheduledtoastnotifications
      outputParameters:
      - type: object
        mapping: $.
