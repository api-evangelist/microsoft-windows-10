naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Storage API — Folders
  description: 'Microsoft Windows 10 Windows Storage API — Folders. 2 operations. Lead operation: Microsoft Windows 10 List
    storage folders. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: storage-folders
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Storage API — Folders business capability. Self-contained, no shared references.
    resources:
    - name: storage-folders
      path: /storage/folders
      operations:
      - name: liststoragefolders
        method: GET
        description: Microsoft Windows 10 List storage folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: parentFolderId
          in: query
          type: string
          description: Parent folder identifier
      - name: createstoragefolder
        method: POST
        description: Microsoft Windows 10 Create a folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: storage-folders-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Storage API — Folders. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/storage/folders
      name: storage-folders
      description: REST surface for storage-folders.
      operations:
      - method: GET
        name: liststoragefolders
        description: Microsoft Windows 10 List storage folders
        call: storage-folders.liststoragefolders
        with:
          parentFolderId: rest.parentFolderId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createstoragefolder
        description: Microsoft Windows 10 Create a folder
        call: storage-folders.createstoragefolder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: storage-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Storage API — Folders. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-storage
      description: Microsoft Windows 10 List storage folders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: storage-folders.liststoragefolders
      with:
        parentFolderId: tools.parentFolderId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-create-folder
      description: Microsoft Windows 10 Create a folder
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: storage-folders.createstoragefolder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
