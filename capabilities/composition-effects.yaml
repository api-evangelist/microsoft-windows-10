naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Composition API — Effects
  description: 'Microsoft Windows 10 Windows Composition API — Effects. 1 operations. Lead operation: Microsoft Windows 10
    Create a composition effect. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Effects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: composition-effects
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Composition API — Effects business capability. Self-contained, no shared references.
    resources:
    - name: composition-effects
      path: /composition/effects
      operations:
      - name: createeffect
        method: POST
        description: Microsoft Windows 10 Create a composition effect
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: composition-effects-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Composition API — Effects. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/composition/effects
      name: composition-effects
      description: REST surface for composition-effects.
      operations:
      - method: POST
        name: createeffect
        description: Microsoft Windows 10 Create a composition effect
        call: composition-effects.createeffect
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composition-effects-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Composition API — Effects. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-create-composition
      description: Microsoft Windows 10 Create a composition effect
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composition-effects.createeffect
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
