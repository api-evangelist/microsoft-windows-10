naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Geolocation API — Position
  description: 'Microsoft Windows 10 Windows Geolocation API — Position. 1 operations. Lead operation: Microsoft Windows 10
    Get current geographic position. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Position
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: geolocation-position
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Geolocation API — Position business capability. Self-contained, no shared references.
    resources:
    - name: geolocation-position
      path: /geolocation/position
      operations:
      - name: getcurrentposition
        method: GET
        description: Microsoft Windows 10 Get current geographic position
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: desiredAccuracy
          in: query
          type: string
          description: Desired position accuracy level
        - name: maximumAge
          in: query
          type: integer
          description: Maximum age of cached position in seconds
        - name: timeout
          in: query
          type: integer
          description: Timeout in seconds for obtaining a position
  exposes:
  - type: rest
    namespace: geolocation-position-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Geolocation API — Position. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/geolocation/position
      name: geolocation-position
      description: REST surface for geolocation-position.
      operations:
      - method: GET
        name: getcurrentposition
        description: Microsoft Windows 10 Get current geographic position
        call: geolocation-position.getcurrentposition
        with:
          desiredAccuracy: rest.desiredAccuracy
          maximumAge: rest.maximumAge
          timeout: rest.timeout
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: geolocation-position-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Geolocation API — Position. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-current
      description: Microsoft Windows 10 Get current geographic position
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: geolocation-position.getcurrentposition
      with:
        desiredAccuracy: tools.desiredAccuracy
        maximumAge: tools.maximumAge
        timeout: tools.timeout
      outputParameters:
      - type: object
        mapping: $.
