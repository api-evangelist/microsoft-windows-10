naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Networking API — WebSockets
  description: 'Microsoft Windows 10 Windows Networking API — WebSockets. 1 operations. Lead operation: Microsoft Windows
    10 Create a WebSocket connection. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - WebSockets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: networking-websockets
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Networking API — WebSockets business capability. Self-contained, no shared references.
    resources:
    - name: networking-websockets
      path: /networking/websockets
      operations:
      - name: createwebsocket
        method: POST
        description: Microsoft Windows 10 Create a WebSocket connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: networking-websockets-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Networking API — WebSockets. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/networking/websockets
      name: networking-websockets
      description: REST surface for networking-websockets.
      operations:
      - method: POST
        name: createwebsocket
        description: Microsoft Windows 10 Create a WebSocket connection
        call: networking-websockets.createwebsocket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: networking-websockets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Networking API — WebSockets. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-create-websocket
      description: Microsoft Windows 10 Create a WebSocket connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: networking-websockets.createwebsocket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
