naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Inclinometer
  description: 'Microsoft Windows 10 Windows Sensors API — Inclinometer. 1 operations. Lead operation: Microsoft Windows 10
    Get inclinometer reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Inclinometer
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-inclinometer
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Inclinometer business capability. Self-contained, no shared references.
    resources:
    - name: sensors-inclinometer-reading
      path: /sensors/inclinometer/reading
      operations:
      - name: getinclinometerreading
        method: GET
        description: Microsoft Windows 10 Get inclinometer reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-inclinometer-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Inclinometer. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/inclinometer/reading
      name: sensors-inclinometer-reading
      description: REST surface for sensors-inclinometer-reading.
      operations:
      - method: GET
        name: getinclinometerreading
        description: Microsoft Windows 10 Get inclinometer reading
        call: sensors-inclinometer.getinclinometerreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-inclinometer-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Inclinometer. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-inclinometer
      description: Microsoft Windows 10 Get inclinometer reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-inclinometer.getinclinometerreading
      outputParameters:
      - type: object
        mapping: $.
