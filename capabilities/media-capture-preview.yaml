naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Media Capture API — Preview
  description: 'Microsoft Windows 10 Windows Media Capture API — Preview. 2 operations. Lead operation: Microsoft Windows
    10 Start camera preview. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Preview
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: media-capture-preview
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Media Capture API — Preview business capability. Self-contained, no shared references.
    resources:
    - name: media-capture-sessions-sessionId-preview-start
      path: /media/capture/sessions/{sessionId}/preview/start
      operations:
      - name: startpreview
        method: POST
        description: Microsoft Windows 10 Start camera preview
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Capture session identifier
          required: true
    - name: media-capture-sessions-sessionId-preview-stop
      path: /media/capture/sessions/{sessionId}/preview/stop
      operations:
      - name: stoppreview
        method: POST
        description: Microsoft Windows 10 Stop camera preview
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          description: Capture session identifier
          required: true
  exposes:
  - type: rest
    namespace: media-capture-preview-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Media Capture API — Preview. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/media/capture/sessions/{sessionid}/preview/start
      name: media-capture-sessions-sessionid-preview-start
      description: REST surface for media-capture-sessions-sessionId-preview-start.
      operations:
      - method: POST
        name: startpreview
        description: Microsoft Windows 10 Start camera preview
        call: media-capture-preview.startpreview
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/media/capture/sessions/{sessionid}/preview/stop
      name: media-capture-sessions-sessionid-preview-stop
      description: REST surface for media-capture-sessions-sessionId-preview-stop.
      operations:
      - method: POST
        name: stoppreview
        description: Microsoft Windows 10 Stop camera preview
        call: media-capture-preview.stoppreview
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: media-capture-preview-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Media Capture API — Preview. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-start-camera
      description: Microsoft Windows 10 Start camera preview
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: media-capture-preview.startpreview
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-stop-camera
      description: Microsoft Windows 10 Stop camera preview
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: media-capture-preview.stoppreview
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
