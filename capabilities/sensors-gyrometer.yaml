naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Gyrometer
  description: 'Microsoft Windows 10 Windows Sensors API — Gyrometer. 1 operations. Lead operation: Microsoft Windows 10 Get
    gyrometer reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Gyrometer
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-gyrometer
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Gyrometer business capability. Self-contained, no shared references.
    resources:
    - name: sensors-gyrometer-reading
      path: /sensors/gyrometer/reading
      operations:
      - name: getgyrometerreading
        method: GET
        description: Microsoft Windows 10 Get gyrometer reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-gyrometer-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Gyrometer. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/gyrometer/reading
      name: sensors-gyrometer-reading
      description: REST surface for sensors-gyrometer-reading.
      operations:
      - method: GET
        name: getgyrometerreading
        description: Microsoft Windows 10 Get gyrometer reading
        call: sensors-gyrometer.getgyrometerreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-gyrometer-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Gyrometer. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-gyrometer
      description: Microsoft Windows 10 Get gyrometer reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-gyrometer.getgyrometerreading
      outputParameters:
      - type: object
        mapping: $.
