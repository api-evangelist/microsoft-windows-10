naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Runtime (WinRT) API — Activation
  description: 'Microsoft Windows 10 Windows Runtime (WinRT) API — Activation. 1 operations. Lead operation: Microsoft Windows
    10 Activate a runtime class. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Activation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winrt-activation
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Runtime (WinRT) API — Activation business capability. Self-contained, no shared
      references.
    resources:
    - name: winrt-activation
      path: /winrt/activation
      operations:
      - name: activateruntimeclass
        method: POST
        description: Microsoft Windows 10 Activate a runtime class
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: winrt-activation-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Activation. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/winrt/activation
      name: winrt-activation
      description: REST surface for winrt-activation.
      operations:
      - method: POST
        name: activateruntimeclass
        description: Microsoft Windows 10 Activate a runtime class
        call: winrt-activation.activateruntimeclass
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winrt-activation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Activation. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-activate-runtime
      description: Microsoft Windows 10 Activate a runtime class
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: winrt-activation.activateruntimeclass
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
