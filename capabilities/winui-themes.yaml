naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 WinUI API — Themes
  description: 'Microsoft Windows 10 WinUI API — Themes. 1 operations. Lead operation: Microsoft Windows 10 List available
    themes. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Themes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winui-themes
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 WinUI API — Themes business capability. Self-contained, no shared references.
    resources:
    - name: winui-themes
      path: /winui/themes
      operations:
      - name: listthemes
        method: GET
        description: Microsoft Windows 10 List available themes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: winui-themes-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 WinUI API — Themes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/winui/themes
      name: winui-themes
      description: REST surface for winui-themes.
      operations:
      - method: GET
        name: listthemes
        description: Microsoft Windows 10 List available themes
        call: winui-themes.listthemes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winui-themes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 WinUI API — Themes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-available
      description: Microsoft Windows 10 List available themes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winui-themes.listthemes
      outputParameters:
      - type: object
        mapping: $.
