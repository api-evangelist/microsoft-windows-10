naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Ink API — Recognition
  description: 'Microsoft Windows 10 Windows Ink API — Recognition. 2 operations. Lead operation: Microsoft Windows 10 Recognize
    handwriting from ink strokes. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Recognition
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: ink-recognition
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Ink API — Recognition business capability. Self-contained, no shared references.
    resources:
    - name: ink-recognize
      path: /ink/recognize
      operations:
      - name: recognizeinkstrokes
        method: POST
        description: Microsoft Windows 10 Recognize handwriting from ink strokes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ink-recognizers
      path: /ink/recognizers
      operations:
      - name: listinkrecognizers
        method: GET
        description: Microsoft Windows 10 List available ink recognizers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: ink-recognition-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Ink API — Recognition. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ink/recognize
      name: ink-recognize
      description: REST surface for ink-recognize.
      operations:
      - method: POST
        name: recognizeinkstrokes
        description: Microsoft Windows 10 Recognize handwriting from ink strokes
        call: ink-recognition.recognizeinkstrokes
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ink/recognizers
      name: ink-recognizers
      description: REST surface for ink-recognizers.
      operations:
      - method: GET
        name: listinkrecognizers
        description: Microsoft Windows 10 List available ink recognizers
        call: ink-recognition.listinkrecognizers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ink-recognition-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Ink API — Recognition. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-recognize-handwriting
      description: Microsoft Windows 10 Recognize handwriting from ink strokes
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ink-recognition.recognizeinkstrokes
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-windows-10-list-available
      description: Microsoft Windows 10 List available ink recognizers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ink-recognition.listinkrecognizers
      outputParameters:
      - type: object
        mapping: $.
