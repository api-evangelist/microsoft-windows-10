naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Accelerometer
  description: 'Microsoft Windows 10 Windows Sensors API — Accelerometer. 1 operations. Lead operation: Microsoft Windows
    10 Get accelerometer reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Accelerometer
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-accelerometer
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Accelerometer business capability. Self-contained, no shared references.
    resources:
    - name: sensors-accelerometer-reading
      path: /sensors/accelerometer/reading
      operations:
      - name: getaccelerometerreading
        method: GET
        description: Microsoft Windows 10 Get accelerometer reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-accelerometer-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Accelerometer. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/accelerometer/reading
      name: sensors-accelerometer-reading
      description: REST surface for sensors-accelerometer-reading.
      operations:
      - method: GET
        name: getaccelerometerreading
        description: Microsoft Windows 10 Get accelerometer reading
        call: sensors-accelerometer.getaccelerometerreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-accelerometer-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Accelerometer. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-accelerometer
      description: Microsoft Windows 10 Get accelerometer reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-accelerometer.getaccelerometerreading
      outputParameters:
      - type: object
        mapping: $.
