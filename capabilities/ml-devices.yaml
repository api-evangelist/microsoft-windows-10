naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows ML API — Devices
  description: 'Microsoft Windows 10 Windows ML API — Devices. 1 operations. Lead operation: Microsoft Windows 10 List available
    ML devices. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: ml-devices
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows ML API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: ml-devices
      path: /ml/devices
      operations:
      - name: listmldevices
        method: GET
        description: Microsoft Windows 10 List available ML devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: ml-devices-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows ML API — Devices. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/ml/devices
      name: ml-devices
      description: REST surface for ml-devices.
      operations:
      - method: GET
        name: listmldevices
        description: Microsoft Windows 10 List available ML devices
        call: ml-devices.listmldevices
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ml-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows ML API — Devices. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-available
      description: Microsoft Windows 10 List available ML devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ml-devices.listmldevices
      outputParameters:
      - type: object
        mapping: $.
