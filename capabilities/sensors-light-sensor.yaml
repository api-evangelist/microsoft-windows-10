naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Sensors API — Light Sensor
  description: 'Microsoft Windows 10 Windows Sensors API — Light Sensor. 1 operations. Lead operation: Microsoft Windows 10
    Get light sensor reading. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Light Sensor
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: sensors-light-sensor
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Sensors API — Light Sensor business capability. Self-contained, no shared references.
    resources:
    - name: sensors-light-reading
      path: /sensors/light/reading
      operations:
      - name: getlightsensorreading
        method: GET
        description: Microsoft Windows 10 Get light sensor reading
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sensors-light-sensor-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Sensors API — Light Sensor. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sensors/light/reading
      name: sensors-light-reading
      description: REST surface for sensors-light-reading.
      operations:
      - method: GET
        name: getlightsensorreading
        description: Microsoft Windows 10 Get light sensor reading
        call: sensors-light-sensor.getlightsensorreading
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sensors-light-sensor-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Sensors API — Light Sensor. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-light
      description: Microsoft Windows 10 Get light sensor reading
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sensors-light-sensor.getlightsensorreading
      outputParameters:
      - type: object
        mapping: $.
