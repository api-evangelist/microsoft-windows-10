naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Networking API — UDP Sockets
  description: 'Microsoft Windows 10 Windows Networking API — UDP Sockets. 1 operations. Lead operation: Microsoft Windows
    10 Create a UDP datagram socket. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - UDP Sockets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: networking-udp-sockets
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Networking API — UDP Sockets business capability. Self-contained, no shared
      references.
    resources:
    - name: networking-sockets-udp
      path: /networking/sockets/udp
      operations:
      - name: createudpsocket
        method: POST
        description: Microsoft Windows 10 Create a UDP datagram socket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: networking-udp-sockets-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Networking API — UDP Sockets. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/networking/sockets/udp
      name: networking-sockets-udp
      description: REST surface for networking-sockets-udp.
      operations:
      - method: POST
        name: createudpsocket
        description: Microsoft Windows 10 Create a UDP datagram socket
        call: networking-udp-sockets.createudpsocket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: networking-udp-sockets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Networking API — UDP Sockets. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-create-udp
      description: Microsoft Windows 10 Create a UDP datagram socket
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: networking-udp-sockets.createudpsocket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
