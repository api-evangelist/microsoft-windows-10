naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Media Capture API — Devices
  description: 'Microsoft Windows 10 Windows Media Capture API — Devices. 1 operations. Lead operation: Microsoft Windows
    10 List media capture devices. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: media-capture-devices
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Media Capture API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: media-capture-devices
      path: /media/capture/devices
      operations:
      - name: listcapturedevices
        method: GET
        description: Microsoft Windows 10 List media capture devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceClass
          in: query
          type: string
          description: Filter by device class
  exposes:
  - type: rest
    namespace: media-capture-devices-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Media Capture API — Devices. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/media/capture/devices
      name: media-capture-devices
      description: REST surface for media-capture-devices.
      operations:
      - method: GET
        name: listcapturedevices
        description: Microsoft Windows 10 List media capture devices
        call: media-capture-devices.listcapturedevices
        with:
          deviceClass: rest.deviceClass
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: media-capture-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Media Capture API — Devices. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-media
      description: Microsoft Windows 10 List media capture devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: media-capture-devices.listcapturedevices
      with:
        deviceClass: tools.deviceClass
      outputParameters:
      - type: object
        mapping: $.
