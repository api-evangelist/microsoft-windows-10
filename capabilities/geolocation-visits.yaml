naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Geolocation API — Visits
  description: 'Microsoft Windows 10 Windows Geolocation API — Visits. 1 operations. Lead operation: Microsoft Windows 10
    Get recent location visits. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Visits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: geolocation-visits
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Geolocation API — Visits business capability. Self-contained, no shared references.
    resources:
    - name: geolocation-visits
      path: /geolocation/visits
      operations:
      - name: getrecentvisits
        method: GET
        description: Microsoft Windows 10 Get recent location visits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: geolocation-visits-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Geolocation API — Visits. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/geolocation/visits
      name: geolocation-visits
      description: REST surface for geolocation-visits.
      operations:
      - method: GET
        name: getrecentvisits
        description: Microsoft Windows 10 Get recent location visits
        call: geolocation-visits.getrecentvisits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: geolocation-visits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Geolocation API — Visits. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-get-recent
      description: Microsoft Windows 10 Get recent location visits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: geolocation-visits.getrecentvisits
      outputParameters:
      - type: object
        mapping: $.
