naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Runtime (WinRT) API — Namespaces
  description: 'Microsoft Windows 10 Windows Runtime (WinRT) API — Namespaces. 1 operations. Lead operation: Microsoft Windows
    10 List WinRT namespaces. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Namespaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: winrt-namespaces
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Runtime (WinRT) API — Namespaces business capability. Self-contained, no shared
      references.
    resources:
    - name: winrt-namespaces
      path: /winrt/namespaces
      operations:
      - name: listwinrtnamespaces
        method: GET
        description: Microsoft Windows 10 List WinRT namespaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: winrt-namespaces-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Namespaces. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/winrt/namespaces
      name: winrt-namespaces
      description: REST surface for winrt-namespaces.
      operations:
      - method: GET
        name: listwinrtnamespaces
        description: Microsoft Windows 10 List WinRT namespaces
        call: winrt-namespaces.listwinrtnamespaces
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: winrt-namespaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Runtime (WinRT) API — Namespaces. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-list-winrt
      description: Microsoft Windows 10 List WinRT namespaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: winrt-namespaces.listwinrtnamespaces
      outputParameters:
      - type: object
        mapping: $.
