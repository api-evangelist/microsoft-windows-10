naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 DirectX Graphics API — Resources
  description: 'Microsoft Windows 10 DirectX Graphics API — Resources. 1 operations. Lead operation: Microsoft Windows 10
    Create a DirectX resource. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: directx-resources
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 DirectX Graphics API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: directx-resources
      path: /directx/resources
      operations:
      - name: createdirectxresource
        method: POST
        description: Microsoft Windows 10 Create a DirectX resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: directx-resources-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 DirectX Graphics API — Resources. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/directx/resources
      name: directx-resources
      description: REST surface for directx-resources.
      operations:
      - method: POST
        name: createdirectxresource
        description: Microsoft Windows 10 Create a DirectX resource
        call: directx-resources.createdirectxresource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: directx-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 DirectX Graphics API — Resources. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-create-directx
      description: Microsoft Windows 10 Create a DirectX resource
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: directx-resources.createdirectxresource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
