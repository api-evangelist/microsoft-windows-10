naftiko: 1.0.0-alpha2
info:
  label: Microsoft Windows 10 Windows Bluetooth API — RFCOMM
  description: 'Microsoft Windows 10 Windows Bluetooth API — RFCOMM. 1 operations. Lead operation: Microsoft Windows 10 Create
    an RFCOMM connection. Self-contained Naftiko capability covering one Microsoft Windows 10 business surface.'
  tags:
  - Microsoft Windows 10
  - RFCOMM
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WINDOWS_10_API_KEY: MICROSOFT_WINDOWS_10_API_KEY
capability:
  consumes:
  - type: http
    namespace: bluetooth-rfcomm
    baseUri: https://api.windows.com
    description: Microsoft Windows 10 Windows Bluetooth API — RFCOMM business capability. Self-contained, no shared references.
    resources:
    - name: bluetooth-rfcomm-connections
      path: /bluetooth/rfcomm/connections
      operations:
      - name: createrfcommconnection
        method: POST
        description: Microsoft Windows 10 Create an RFCOMM connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: bluetooth-rfcomm-rest
    port: 8080
    description: REST adapter for Microsoft Windows 10 Windows Bluetooth API — RFCOMM. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/bluetooth/rfcomm/connections
      name: bluetooth-rfcomm-connections
      description: REST surface for bluetooth-rfcomm-connections.
      operations:
      - method: POST
        name: createrfcommconnection
        description: Microsoft Windows 10 Create an RFCOMM connection
        call: bluetooth-rfcomm.createrfcommconnection
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bluetooth-rfcomm-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Windows 10 Windows Bluetooth API — RFCOMM. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-windows-10-create-rfcomm
      description: Microsoft Windows 10 Create an RFCOMM connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bluetooth-rfcomm.createrfcommconnection
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
