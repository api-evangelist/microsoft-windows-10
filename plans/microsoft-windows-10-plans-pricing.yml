description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: microsoft-windows-10-free
    name: Free
    type: freemium
    description: Free entry tier for the Microsoft Windows 10 API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://api.windows.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://api.windows.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: Community Support
      - name: Sandbox Access
      - name: Windows Runtime (WinRT) API
      - name: Win32 API
      - name: Windows Notifications API
      - name: Windows ML API
      - name: Windows Storage API
      - name: Windows Cortana API
      - name: Windows Ink API
      - name: Windows Composition API
  - id: microsoft-windows-10-pro
    name: Professional
    type: paid
    description: Production tier for Microsoft Windows 10. Provides higher quotas, priority support, and
      access to the broader API portfolio. Pricing placeholder; align with the provider's pricing page.
    entries:
      - label: API Requests
        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://api.windows.com
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the professional tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 100
        timeFrame: minute
        geo: global
        domains:
          - https://api.windows.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Overage
        description: Per-request price after monthly quota is exceeded
        name: overage
        type: metered
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://api.windows.com
        unit: 1000
        price: TBD
        userMultiplied: false
    elements:
      - name: All Production Endpoints
      - name: Email Support
      - name: SLA Targets
      - name: Webhook Subscriptions
      - name: Windows Runtime (WinRT) API
      - name: Win32 API
      - name: Windows Notifications API
      - name: Windows ML API
      - name: Windows Storage API
      - name: Windows Cortana API
      - name: Windows Ink API
      - name: Windows Composition API
      - name: DirectX Graphics API
      - name: Windows Media Capture API
      - name: Windows Networking API
      - name: Windows Bluetooth API
      - name: Windows Geolocation API
      - name: Windows Sensors API
      - name: Windows Hello Authentication API
      - name: WinUI API
      - name: Windows Background Tasks API
  - id: microsoft-windows-10-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-negotiated tier for Microsoft Windows 10. Includes dedicated capacity, contractual
      SLAs, security review, data residency options, and named technical account management.
    entries:
      - label: API Requests
        description: Negotiated request volume; -1 indicates uncapped subject to fair use
        name: api_requests
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: configurable
        domains:
          - https://api.windows.com
        unit: 1
        price: custom
        userMultiplied: false
      - label: Rate Limit
        description: Negotiated burst and steady-state rate
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        geo: configurable
        domains:
          - https://api.windows.com
        unit: 1
        price: custom
        userMultiplied: false
