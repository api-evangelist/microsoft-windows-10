specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Windows 10
providerId: microsoft-windows-10
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Operating System
  - Desktop
  - Windows
  - Microsoft
description: Microsoft Windows 10 reached End of Support on 2025-10-14. The Windows 10 platform APIs
  (Win32, UWP, WinRT) are local to the OS and are not metered or sold as a network API. Commercially,
  Microsoft now sells Windows 10 access primarily as a per-device Extended Security Updates (ESU)
  subscription via Volume Licensing, priced at $61/device for Year One, doubling each subsequent year
  for up to three years (Year 2 = $122, Year 3 = $244). ESU is included at no extra cost for Windows
  10 VMs running on Windows 365, Azure Virtual Desktop, Azure VMs, and several Azure Stack / VMware
  Solution offerings.
sources:
  - https://learn.microsoft.com/en-us/windows/whats-new/extended-security-updates
  - https://www.microsoft.com/windows/end-of-support
notes: Windows 10 platform APIs are device-local (Win32 / UWP / WinRT) and are not exposed as a
  hosted, metered HTTP API. Commercial pricing reflects Extended Security Updates only.
plans:
  - id: microsoft-windows-10-esu-year-1
    name: Windows 10 ESU — Year 1 (Commercial)
    type: subscription
    description: First-year Extended Security Updates subscription via Microsoft Volume Licensing.
      Coverage period begins November 2025; minimum 1 license.
    entries:
      - label: Per-device subscription
        name: esu_year1
        type: subscription
        metric: device
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: '61.00'
        userMultiplied: false
    elements:
      - name: Critical and important security updates
      - name: Windows 10 22H2 prerequisite
      - name: Cumulative — must purchase prior years
  - id: microsoft-windows-10-esu-year-2
    name: Windows 10 ESU — Year 2 (Commercial)
    type: subscription
    description: Second-year Extended Security Updates. Price doubles year-over-year.
    entries:
      - label: Per-device subscription
        name: esu_year2
        type: subscription
        metric: device
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: '122.00'
        userMultiplied: false
    elements:
      - name: Cumulative — Year 1 must also be purchased
  - id: microsoft-windows-10-esu-year-3
    name: Windows 10 ESU — Year 3 (Commercial)
    type: subscription
    description: Third (and final) year of ESU eligibility for commercial/educational customers.
    entries:
      - label: Per-device subscription
        name: esu_year3
        type: subscription
        metric: device
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: '244.00'
        userMultiplied: false
    elements:
      - name: Maximum three years of post-EOS coverage
      - name: Cumulative — prior years must be purchased
  - id: microsoft-windows-10-esu-cloud-included
    name: Windows 10 ESU — Cloud / VM (Included)
    type: subscription
    description: ESU is included at no additional cost for Windows 10 virtual machines on Windows 365,
      Azure Virtual Desktop, Azure VMs, Azure Dedicated Host, Azure VMware Solution, Nutanix Cloud
      Clusters on Azure, Azure Local, Azure Stack Hub, and Azure Stack Edge. Endpoints connecting to
      Windows 365 Cloud PCs are also entitled.
    entries:
      - label: Cloud-entitled ESU
        name: esu_cloud
        type: subscription
        metric: device
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Windows 365
      - name: Azure Virtual Desktop
      - name: Azure VMs
      - name: Azure Local / Stack Hub / Stack Edge
      - name: Azure VMware Solution
  - id: microsoft-windows-10-esu-consumer
    name: Windows 10 Consumer ESU
    type: subscription
    description: Separate consumer-targeted ESU enrollment for Windows 10 Home customers; pricing and
      enrollment are managed via the Windows ESU consumer page.
    entries:
      - label: Per-device consumer enrollment
        name: esu_consumer
        type: subscription
        metric: device
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see https://www.microsoft.com/windows/extended-security-updates
        userMultiplied: false
    elements:
      - name: Windows 10 Home eligible
      - name: Critical and important security updates only
maintainers:
